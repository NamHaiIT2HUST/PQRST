configs:
  - name: coupled_low_noise
    a: 0.5
    b: 0.5
    c: 0.6
    noise_std: 0.5
    pseudo_ground_truth_te: 0.124832
  - name: uncoupled
    a: 0.5
    b: 0.5
    c: 0.0
    noise_std: 0.5
    # 0.0 la gia tri LY THUYET dung (c=0 -> X, Y doc lap -> TE that = 0 chinh xac),
    # khong phai gia tri KSG in ra tu notebook (KSG tai N=200k ra -0.000880, do bias
    # am huu han mau khi TE that gan 0). Xem notebooks/estimate_pseudo_ground_truth.ipynb.
    pseudo_ground_truth_te: 0.0

pseudo_ground_truth_n_samples: 200000
n_grid: [10, 20, 30, 50, 100, 200]
n_repetitions: 50
