[project]
name = "pqrst"
version = "0.1.0"
description = "Q-BHC / AQNE-TE: amortized transfer entropy estimation for cardiac-brain coupling (classical MINE, later quantum)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
